name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Step 1: Run test.yml first
  run-tests:
    uses: ./.github/workflows/test.yml

  # Step 2: Deploy only if tests & build pass
  deploy:
    needs: run-tests
    runs-on: ubuntu-latest

    # Required so GitHub can mint a short-lived OIDC token for Google Cloud
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: developer-512406
          service: express-ts-test-server
          region: asia-south1
          source: .
          flags: '--allow-unauthenticated'

      - name: Show live URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
